# The blog's promotion pipeline. Values live in the blog repo at kargo/values.yaml.
#
# namespace is blog-delivery, not blog: the Kargo project chart names its
# namespace after the project, and `blog` already belongs to the running site.
project: blog-delivery
namespace: blog-delivery
repoURL: https://github.com/Fomiller/blog.git
targetRevision: main
registry: 695434033664.dkr.ecr.us-east-1.amazonaws.com
chartVersion: 0.1.2
