apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - github.com/argoproj-labs/argocd-autopilot/manifests/base?ref=v0.4.17
  - namespace.yaml
  - ingressroute.yaml

configMapGenerator:
- name: argocd-cm
  behavior: merge
  literals:
  - |
    repository.credentials=- passwordSecret:
        key: git_token
        name: autopilot-secret
      url: https://github.com/
      usernameSecret:
        key: git_username
        name: autopilot-secret
  # --enable-helm lets an overlay inflate a chart with `helmCharts:`. That runs
  # the helm binary, which needs its own registry credential — see
  # repo-server.patch.yaml.
  - kustomize.buildOptions="--enable-alpha-plugins --enable-exec --load-restrictor=LoadRestrictionsNone --enable-helm"
- name: argocd-cmd-params-cm
  behavior: merge
  literals:
  - server.insecure="true"

patches:
  - path: tailscale.patch.yaml
    target:
      kind: Service
      name: argocd-server
  - path: repo-server.patch.yaml
    target:
      kind: Deployment
      name: argocd-repo-server
  - path: applicationsets-crd.patch.yaml
    target:
      version: v1
      kind: CustomResourceDefinition
      name: applicationsets.argoproj.io
