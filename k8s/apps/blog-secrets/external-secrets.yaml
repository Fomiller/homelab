# The blog's Directus token, in the namespace the blog runs in.
#
# It lives here rather than in the blog's own repo because the blog repo ships
# a chart, and a chart is not the place for a reference to this cluster's
# Secrets Manager. The cluster's secret plumbing is homelab's, the same way
# ecr-credentials is.
#
# The namespace itself is created by the services ApplicationSet, not here.
# This app only adds a Secret to it, so it carries no namespace.yaml — two
# owners for one namespace is how you get a sync loop.
#
# Terraform-controlled: infra/units/aws/global/secrets/blog.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blog-application-secret
  namespace: blog
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-clustersecretstore
    kind: ClusterSecretStore
  target:
    name: blog-application-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev/fomiller/homelab/blog-application-secret
