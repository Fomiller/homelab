apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml

namespace: keda

helmCharts:
- name: keda
  repo: https://kedacore.github.io/charts
  releaseName: keda
  version: 2.21.0
  namespace: keda
  includeCRDs: true
  valuesFile: values.yaml

# The ScaledJob CRD is ~650 KB, over the 262144 byte limit on the
# last-applied-configuration annotation that a client-side apply writes.
# Server-side apply doesn't use that annotation.
patches:
- target:
    kind: CustomResourceDefinition
  patch: |-
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: unused
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
