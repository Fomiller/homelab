apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
# barman-cloud is what actually writes backups to S3 — CNPG 1.30 still has the
# in-tree spec.backup.barmanObjectStore, but it's deprecated in favour of this.
# Installs into cnpg-system alongside the operator. Needs cert-manager, which
# issues the certs for the plugin's gRPC endpoint.
- https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.14.0/manifest.yaml

helmCharts:
- name: cloudnative-pg
  repo: https://cloudnative-pg.github.io/charts
  version: 0.29.0
  releaseName: cnpg
  namespace: cnpg-system
  includeCRDs: true
  valuesFile: values.yaml

# Two of these CRDs are enormous — clusters.postgresql.cnpg.io is ~464 KB and
# poolers.postgresql.cnpg.io is ~653 KB. A client-side apply stuffs the whole
# manifest into the kubectl.kubernetes.io/last-applied-configuration
# annotation, which caps at 262144 bytes, so the sync fails with
# "metadata.annotations: Too long". Server-side apply doesn't use that
# annotation at all.
patches:
- target:
    kind: CustomResourceDefinition
  patch: |-
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: unused
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
