apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml

helmCharts:
- name: cloudnative-pg
  repo: https://cloudnative-pg.github.io/charts
  version: 0.29.0
  releaseName: cnpg
  namespace: cnpg-system
  includeCRDs: true
  valuesFile: values.yaml

# Two of these CRDs are enormous — clusters.postgresql.cnpg.io is ~464 KB and
# poolers.postgresql.cnpg.io is ~653 KB. A client-side apply stuffs the whole
# manifest into the kubectl.kubernetes.io/last-applied-configuration
# annotation, which caps at 262144 bytes, so the sync fails with
# "metadata.annotations: Too long". Server-side apply doesn't use that
# annotation at all.
patches:
- target:
    kind: CustomResourceDefinition
  patch: |-
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: unused
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
