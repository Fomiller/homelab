apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trek

resources:
- namespace.yaml
- external-secrets.yaml
- ingressroute.yaml

helmCharts:
- name: trek
  repo: https://chart.liketrek.com
  releaseName: trek
  includeCRDs: true
  version: 4.1.1
  namespace: trek
  valuesFile: values.yaml
