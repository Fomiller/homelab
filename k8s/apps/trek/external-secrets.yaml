---
# Bootstrap credential, terraform-controlled (infra/units/aws/global/secrets
# doppler_sa_token -> AWS Secrets Manager), same pattern as
# tailscale-operator-creds / homepage. This ExternalSecret materializes it as
# the doppler-token-sa Secret that the SecretStore below reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: doppler-token-sa
  namespace: trek
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: aws-clustersecretstore
    kind: ClusterSecretStore
  target:
    name: doppler-token-sa
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev/fomiller/homelab/doppler-token-sa
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: doppler-trek
  namespace: trek
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-sa
            key: dopplerToken
      project: trek
      config: dev
---
# Explicit key mapping, not a find/regexp: the Doppler names say where a value
# came from, the Secret keys have to be what the trek chart's deployment reads
# out of existingSecret.
#
# ENCRYPTION_KEY is the at-rest key for everything TREK stores encrypted (API
# keys, MFA seeds, SMTP and OIDC credentials). Generate it once with
# `openssl rand -hex 32` and never change it — rotating it orphans all of that.
# The chart's own generateEncryptionKey can't do this job: it resolves the
# current key with Helm's `lookup`, which returns nothing when Argo CD renders
# through kustomize, so every sync would mint a new one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-secrets
  namespace: trek
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: SecretStore
    name: doppler-trek
  target:
    name: trek-secrets
    creationPolicy: Owner
  data:
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: TREK_ENCRYPTION_KEY
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: TREK_OAUTH_CLIENT_SECRET
