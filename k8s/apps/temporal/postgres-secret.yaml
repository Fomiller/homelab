# In-cluster generated credential for Temporal's bundled Postgres
# (postgres.yaml) - ESO's Password generator (external-secrets is already
# deployed, k8s/apps/external-secrets, chart 0.19.2) creates the password
# and stores it only as a Secret in this cluster; nothing sensitive is
# committed to git, and no external secret store/Doppler project is needed.
#
# refreshPolicy: CreatedOnce (+ target.immutable) pins this to a single
# generation - the Password generator is stateless, so a normal Periodic
# refresh would hand Temporal a brand new random password on every
# reconcile while the actual Postgres role password stays whatever was set
# at first pod start, breaking auth.
#
# Output key defaults to "password" (Password generator default, see
# secretKeys), matching what postgres.yaml's POSTGRES_PASSWORD
# secretKeyRef and Temporal's values.yaml existingSecret both expect.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: temporal-postgres-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-postgres-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: temporal-postgres-secret
    creationPolicy: Owner
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: temporal-postgres-password
