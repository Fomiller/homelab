apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The monitoring Namespace is owned by the loki app. Declaring it here too
# would make two Argo apps fight over it.
namespace: monitoring

configMapGenerator:
- name: alloy-config
  files:
  - config.alloy
  options:
    # Alloy's config-reloader picks up edits in place, so no rollout needed.
    disableNameSuffixHash: true

helmCharts:
- name: alloy
  releaseName: alloy
  repo: https://grafana.github.io/helm-charts
  version: 1.14.3
  namespace: monitoring
  valuesFile: values.yaml
