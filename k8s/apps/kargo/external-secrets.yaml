---
# Bootstrap credential, terraform-controlled (infra/units/aws/global/secrets
# eso_doppler_sa_token -> AWS Secrets Manager). One shared service account
# reaches every app's Doppler project, so a new project has to be added to its
# access list or this store authenticates but reads nothing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: doppler-token-sa
  namespace: kargo
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: aws-clustersecretstore
    kind: ClusterSecretStore
  target:
    name: doppler-token-sa
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev/fomiller/homelab/doppler-token-sa
---
# Cluster-scoped, unlike every other doppler-* store in this repo, which are
# namespaced SecretStores sitting beside the app they serve.
#
# Kargo is the exception because its credentials are not all read from this
# namespace. A Kargo Project gets its own namespace, created by
# kargo-project-chart, and Kargo looks for that project's git and image
# credentials there — not here. A SecretStore cannot be read across namespaces,
# so a namespaced store leaves every project namespace unable to reach Doppler.
#
# Cluster scope also matches what the credentials are: the promotion bot's key
# is a Kargo-wide credential, not a control-plane one. A project namespace then
# needs one object (its own ExternalSecret) rather than a copy of the token and
# the store as well.
#
# Cluster-scoped resources have no ambient namespace, so the token reference
# below has to name one explicitly. Without it the store resolves nothing and
# reports an auth failure that says nothing about namespaces.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: doppler-kargo-clustersecretstore
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-sa
            namespace: kargo
            key: dopplerToken
      project: kargo
      config: dev
---
# These two key names are Kargo's own env var names — the API Deployment pulls
# this Secret in with envFrom, so renaming either one silently drops it.
#
# Doppler project "kargo" / config "dev" needs:
#   ADMIN_ACCOUNT_PASSWORD_HASH
#     htpasswd -bnBC 10 "" <password> | tr -d ':\n'
#   ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
#     openssl rand -base64 29 | tr -d "=+/"
#
# It also holds KARGO_BOT_PRIVATE_KEY, the fomiller-kargo-bot GitHub App key
# (app id 4686096) that Kargo signs promotion commits with. That one is read
# from a Kargo PROJECT namespace, not from here, which is why the store above
# is cluster-scoped.
#
# Rotating the signing key invalidates every token Kargo has issued.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-api
  namespace: kargo
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-kargo-clustersecretstore
  target:
    name: kargo-api
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_ACCOUNT_PASSWORD_HASH
      remoteRef:
        key: ADMIN_ACCOUNT_PASSWORD_HASH
    - secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
      remoteRef:
        key: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
