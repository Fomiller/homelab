# Credentials for the blog's Kargo project.
#
# Kargo looks for a project's credentials in the PROJECT's namespace, not in
# the kargo control-plane namespace, and finds them by the
# kargo.akuity.io/cred-type label. The repoURL/repoURLPattern in each Secret is
# what Kargo matches a request against.
#
# The namespace itself is created by the kargo-project-chart, so nothing here
# creates it.
---
# Promotions are commits. This is the identity that makes them: the
# fomiller-kargo-bot GitHub App, installed on the Fomiller account.
#
# An App rather than a PAT because the credential is scoped to an installation
# rather than to a person, and its tokens are short-lived — Kargo mints one per
# promotion from the private key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-git-credentials
  namespace: blog-delivery
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-kargo-clustersecretstore
  target:
    name: kargo-git-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        # Kargo matches on this prefix, so one Secret covers every repo the
        # promotion writes to.
        repoURL: https://github.com/Fomiller/
        repoURLIsRegex: "false"
        githubAppID: "{{ .KARGO_BOT_APP_ID }}"
        githubAppInstallationID: "{{ .KARGO_BOT_INSTALLATION_ID }}"
        githubAppPrivateKey: "{{ .KARGO_BOT_PRIVATE_KEY }}"
  data:
    - secretKey: KARGO_BOT_APP_ID
      remoteRef:
        key: KARGO_BOT_APP_ID
    - secretKey: KARGO_BOT_INSTALLATION_ID
      remoteRef:
        key: KARGO_BOT_INSTALLATION_ID
    - secretKey: KARGO_BOT_PRIVATE_KEY
      remoteRef:
        key: KARGO_BOT_PRIVATE_KEY
---
# Kargo discovers freight by listing tags in ECR, which needs a registry
# credential of its own — the kubelet's pull secret is not visible to it.
#
# Same minted token the rest of the cluster uses, replicated out of
# external-secrets. See k8s/apps/ecr-credentials.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-ecr-image-credentials
  namespace: blog-delivery
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ecr-token-clustersecretstore
  target:
    name: kargo-ecr-image-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: image
      data:
        repoURL: 695434033664.dkr.ecr.us-east-1.amazonaws.com
        repoURLIsRegex: "false"
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: ecr-token
---
# The chart subscription is a separate credential type, even though it is the
# same registry and the same token. Kargo looks up helm and image credentials
# independently, so a single Secret labelled `image` leaves chart discovery
# unauthenticated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-ecr-chart-credentials
  namespace: blog-delivery
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: ecr-token-clustersecretstore
  target:
    name: kargo-ecr-chart-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          kargo.akuity.io/cred-type: helm
      data:
        repoURL: oci://695434033664.dkr.ecr.us-east-1.amazonaws.com
        repoURLIsRegex: "false"
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: ecr-token
