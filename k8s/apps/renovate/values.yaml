cronjob:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # The App key is mounted only here. Renovate gets the minted token and nothing else.
  initContainers:
    - name: mint-token
      # Keep in step with the chart's image tag.
      image: ghcr.io/renovatebot/renovate:44.171.8
      command: ["node", "/opt/renovate/mint-token.js", "/var/run/github-app", "/var/run/renovate-token/token"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: renovate-config
          mountPath: /opt/renovate
          readOnly: true
        - name: github-app
          mountPath: /var/run/github-app
          readOnly: true
        - name: renovate-token
          mountPath: /var/run/renovate-token
  # Assigned before export so a missing token stops the run under set -e.
  preCommand: |
    RENOVATE_TOKEN="$(cat /var/run/renovate-token/token)"
    export RENOVATE_TOKEN

renovate:
  existingConfigFile: /opt/renovate/config.json
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# 12021 is the user baked into the renovate image.
securityContext:
  runAsNonRoot: true
  runAsUser: 12021
  # Group-owns the secret volume so 12021 can read the App key files.
  fsGroup: 12021
  seccompProfile:
    type: RuntimeDefault

extraVolumes:
  - name: renovate-config
    configMap:
      name: renovate-config
  - name: github-app
    secret:
      secretName: renovate-credentials
      defaultMode: 0440
  - name: renovate-token
    emptyDir:
      medium: Memory
      sizeLimit: 1Mi

extraVolumeMounts:
  - name: renovate-config
    mountPath: /opt/renovate
    readOnly: true
  - name: renovate-token
    mountPath: /var/run/renovate-token
    readOnly: true

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi
