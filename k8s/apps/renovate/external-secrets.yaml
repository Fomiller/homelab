---
# Same doppler-token-sa bootstrap as homepage/external-secrets.yaml, which
# explains where the token comes from and its blast radius.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: doppler-token-sa
  namespace: renovate
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: aws-clustersecretstore
    kind: ClusterSecretStore
  target:
    name: doppler-token-sa
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev/fomiller/homelab/doppler-token-sa
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: doppler-renovate
  namespace: renovate
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-sa
            key: dopplerToken
      project: renovate
      config: dev
---
# Credentials for the fomiller-renovate-bot GitHub App. It is installed on
# every Fomiller repo with contents, pull requests and workflows write, so
# autodiscoverFilter in renovate-config.json is what limits which repos it
# touches. Keys are renamed because Renovate reads any RENOVATE_* env var as
# its own config, and RENOVATE_PRIVATE_KEY is already one of its options.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-credentials
  namespace: renovate
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: SecretStore
    name: doppler-renovate
  target:
    name: renovate-credentials
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_APP_CLIENT_ID
      remoteRef:
        key: RENOVATE_CLIENT_ID
    - secretKey: GITHUB_APP_INSTALLATION_ID
      remoteRef:
        key: RENOVATE_INSTALLATION_ID
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: RENOVATE_PRIVATE_KEY
