# atticd reaches S3 through IRSA, not static keys. aws-sdk-s3's default
# credential chain picks up AWS_ROLE_ARN / AWS_WEB_IDENTITY_TOKEN_FILE, which
# the amazon-eks-pod-identity-webhook injects when it sees this annotation.
#
# The role's trust policy pins sub to system:serviceaccount:attic:attic
# (infra/units/aws/global/iam/roles), so renaming this ServiceAccount or its
# namespace breaks the AssumeRoleWithWebIdentity call.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: attic
  namespace: attic
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::695434033664:role/FomillerAtticS3Access
