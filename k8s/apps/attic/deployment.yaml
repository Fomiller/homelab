apiVersion: apps/v1
kind: Deployment
metadata:
  name: attic
  namespace: attic
spec:
  replicas: 1
  # Monolithic mode runs the garbage collector in-process. A rolling update
  # would briefly have two GC loops walking the same database and bucket, so
  # take the old pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic
    spec:
      serviceAccountName: attic
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atticd
          # ghcr.io/zhaofengli/attic has no release tags, only :latest and
          # per-commit SHAs, so pin the digest. Bump it deliberately; see
          # README.md for how to resolve a new one.
          image: ghcr.io/zhaofengli/attic:latest@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
          args:
            - -f
            - /etc/atticd/server.toml
          ports:
            - name: http
              containerPort: 8080
          env:
            # CNPG writes a ready-made connection string into this Secret when
            # it bootstraps the cluster. SeaORM accepts the postgresql:// form
            # as-is.
            - name: ATTIC_SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: attic-db-app
                  key: uri
            - name: ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64
              valueFrom:
                secretKeyRef:
                  name: attic-secrets
                  key: ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64
          # allowed-hosts rejects anything that isn't attic.fomiller.com, and
          # kubelet sends the pod IP as Host by default, so probes have to
          # spoof it.
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: attic.fomiller.com
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: attic.fomiller.com
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          # Migrations run at startup and the first one chunks any pre-existing
          # NARs, so give it room before the liveness probe starts counting.
          startupProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: attic.fomiller.com
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/atticd
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: attic-config
        # The image is a dockerTools build with no /tmp of its own, and the
        # root filesystem is read-only.
        - name: tmp
          emptyDir: {}
