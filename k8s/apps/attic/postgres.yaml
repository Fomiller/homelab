# Attic's metadata store: which NARs exist, which chunks they're made of, and
# which cache owns what. Losing it orphans every object in S3, so this is the
# part that needs a backup.
#
# CNPG generates the attic-db-cnpg-app Secret (username/password/host/dbname
# plus a ready-made `uri`), which deployment.yaml feeds straight to
# ATTIC_SERVER_DATABASE_URL. Nothing here needs Doppler.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: attic-db-cnpg
  namespace: attic
spec:
  # Single instance on purpose. A second one buys failover, and an atticd
  # outage just means Nix falls back to cache.nixos.org. What actually
  # protects this data is a backup, which is tracked separately.
  instances: 1

  # Pinned rather than left to the operator's built-in default, which moves
  # with the chart version. CNPG refuses an implicit major-version jump, so an
  # unpinned image turns a routine chart bump into a stuck cluster.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  bootstrap:
    initdb:
      database: attic
      owner: attic

  # Chunk metadata only, no blobs — the NARs live in S3. Measured at 8 MB
  # after migrations. Longhorn can grow a volume but not shrink one, so this
  # is sized to the workload rather than rounded up.
  storage:
    size: 3Gi
    storageClass: longhorn

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
