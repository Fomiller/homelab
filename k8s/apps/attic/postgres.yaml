# Attic's metadata store: which NARs exist, which chunks they're made of, and
# which cache owns what. Losing it orphans every object in S3, so this is the
# part that needs a backup.
#
# CNPG generates the attic-db-cnpg-app Secret (username/password/host/dbname
# plus a ready-made `uri`), which deployment.yaml feeds straight to
# ATTIC_SERVER_DATABASE_URL. Nothing here needs Doppler.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: attic-db-cnpg
  namespace: attic
spec:
  # Single instance on purpose. A second one buys failover, and an atticd
  # outage just means Nix falls back to cache.nixos.org. Durability comes from
  # the barman-cloud backups below, not from a replica.
  instances: 1

  # barman-cloud writes base backups and archives WAL to S3. isWALArchiver
  # is what makes recovery continuous — without it you can only restore to
  # the last base backup.
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: attic-db-backup

  # IRSA for the backup sidecar. CNPG names the ServiceAccount after the
  # cluster, so the role's trust policy pins sub to
  # system:serviceaccount:attic:attic-db-cnpg — renaming the cluster breaks it.
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::695434033664:role/FomillerCnpgBackupS3Access

  # Pinned rather than left to the operator's built-in default, which moves
  # with the chart version. CNPG refuses an implicit major-version jump, so an
  # unpinned image turns a routine chart bump into a stuck cluster.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  bootstrap:
    initdb:
      database: attic
      owner: attic

  # Chunk metadata only, no blobs — the NARs live in S3. Measured at 8 MB
  # after migrations. Longhorn can grow a volume but not shrink one, so this
  # is sized to the workload rather than rounded up.
  storage:
    size: 3Gi
    storageClass: longhorn

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
