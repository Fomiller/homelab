---
# Bootstrap credential, terraform-controlled (infra/units/aws/global/secrets
# doppler_sa_token -> AWS Secrets Manager), same pattern as romm / homepage.
# This ExternalSecret materializes it as the doppler-token-sa Secret that the
# SecretStore below reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: doppler-token-sa
  namespace: attic
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: aws-clustersecretstore
    kind: ClusterSecretStore
  target:
    name: doppler-token-sa
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev/fomiller/homelab/doppler-token-sa
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: doppler-attic
  namespace: attic
spec:
  provider:
    doppler:
      auth:
        secretRef:
          dopplerToken:
            name: doppler-token-sa
            key: dopplerToken
      project: attic
      config: dev
---
# Only one secret here. The Postgres credentials come from CNPG's generated
# attic-db-cnpg-app Secret, and S3 access comes from IRSA, so this is the whole
# secret surface.
#
# Doppler project "attic" / config "dev" needs:
#   ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64
#     openssl genrsa -traditional 4096 | base64 -w0
#
# Rotating it invalidates every token ever minted, including the ones in
# /etc/nix/netrc on both Macs. See README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: attic-secrets
  namespace: attic
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: SecretStore
    name: doppler-attic
  target:
    name: attic-secrets
    creationPolicy: Owner
  data:
    - secretKey: ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64
      remoteRef:
        key: ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64
