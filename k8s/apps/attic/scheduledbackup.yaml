# Nightly base backup. WAL is archived continuously by the plugin, so this
# only bounds how much WAL a restore has to replay, not how much data is
# recoverable.
#
# The schedule is a 6-field cron — CNPG includes seconds, unlike Kubernetes
# CronJob. This is 02:30 daily, not 30 seconds past 02:00.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: attic-db-cnpg-nightly
  namespace: attic
spec:
  schedule: "0 30 2 * * *"
  backupOwnerReference: self
  cluster:
    name: attic-db-cnpg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
