# In-cluster generated credentials for netbox's bundled Postgres/Valkey and
# its superuser account - see the note in values.yaml for why these can't be
# left to the chart's own auto-generation. Generated once via ESO's Password/
# UUID/Fake generators and never regenerated (refreshPolicy: CreatedOnce), so
# they stay stable across every future sync regardless of how the chart
# renders.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: netbox-postgresql-password
spec:
  length: 32
  digits: 8
  symbols: 0
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: netbox-valkey-password
spec:
  length: 32
  digits: 8
  symbols: 0
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: netbox-superuser-password
spec:
  length: 32
  digits: 8
  symbols: 0
---
# Django's SECRET_KEY - chart docs ask for 50+ random characters.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: netbox-secret-key
spec:
  length: 60
  digits: 10
  symbols: 0
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: UUID
metadata:
  name: netbox-superuser-token
---
# Non-secret static values (visible in the netbox UI/login page anyway) -
# merged into the superuser Secret alongside the generated password/token
# below since the chart reads all four keys from one Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Fake
metadata:
  name: netbox-superuser-static
spec:
  data:
    username: admin
    email: admin@example.com
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-config-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: netbox-config-secret
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: netbox-secret-key
      rewrite:
        - regexp:
            source: "password"
            target: "secret_key"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-postgresql-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: netbox-postgresql-secret
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: netbox-postgresql-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-valkey-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: netbox-valkey-secret
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: netbox-valkey-password
      rewrite:
        - regexp:
            source: "password"
            target: "valkey-password"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-superuser-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: netbox-superuser-secret
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: netbox-superuser-password
      rewrite:
        - regexp:
            source: "password"
            target: "password"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: UUID
          name: netbox-superuser-token
      rewrite:
        - regexp:
            source: "uuid"
            target: "api_token"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Fake
          name: netbox-superuser-static
