# Bundled Postgres (Bitnami subchart) and Valkey (Redis-compatible cache /
# task queue) stay enabled - this is a single NetBox instance, not a shared
# DB platform, so there's no separate database app for it to lean on.
#
# Credentials are NOT left to the chart's own auto-generation
# (generator.yaml + external-secrets.yaml pin them instead): this repo
# renders Helm charts via `kustomize build --enable-helm`, which shells out
# to `helm template`, not `helm install/upgrade` - the Bitnami subcharts'
# usual trick of reusing a previous release's password via Helm's `lookup`
# function doesn't work there, so every sync would render a brand new
# random password into the Secret while Postgres/Valkey keep the one they
# were actually initialized with. Found this the hard way: a routine
# ArgoCD resync broke login with "password authentication failed" within
# minutes of first standing this up.

# Same instability applies to Django's own SECRET_KEY (session/CSRF
# signing) - regenerating it on every sync would silently log everyone out
# and 403 in-flight CSRF tokens. Pinned the same way.
existingSecret: netbox-config-secret

superuser:
  existingSecret: netbox-superuser-secret

persistence:
  # Longhorn is already this cluster's default StorageClass; set explicitly
  # for clarity, matching the other apps that use PVCs.
  storageClass: longhorn
  # Default is ReadWriteOnce, which two different Deployments (netbox web +
  # netbox-worker) both mounting the same media PVC can't share once the
  # scheduler puts them on different nodes - Longhorn's RWX (share-manager
  # backed) support handles that.
  accessMode: ReadWriteMany

postgresql:
  auth:
    existingSecret: netbox-postgresql-secret
    # Skips creating/needing a password for the "postgres" superuser -
    # nothing needs superuser access to this single-tenant DB, so there's
    # one fewer credential to generate and pin.
    enablePostgresUser: false
  primary:
    persistence:
      storageClass: longhorn

valkey:
  # Standalone, not the chart's default replication architecture - this is
  # just NetBox's cache/task-queue backend, a second replica buys nothing.
  architecture: standalone
  auth:
    existingSecret: netbox-valkey-secret
    existingSecretPasswordKey: valkey-password
  primary:
    persistence:
      storageClass: longhorn

# Fronted by our own Traefik IngressRoute (ingressroute.yaml), so the
# chart's own ingress stays off.
ingress:
  enabled: false

# Behind Cloudflare Tunnel -> Traefik (http, no in-cluster TLS), so the
# browser's Origin header is https even though NetBox sees a plain http
# request. Without this, Django's CSRF check 403s on login (and any other
# POST) because the origin scheme doesn't match what NetBox thinks it's
# serving on.
csrf:
  trustedOrigins:
    - https://netbox.fomiller.com
