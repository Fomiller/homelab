# Chart default is `kind: CronJob`, which spins up a fresh one-shot Job pod
# every tick. Run it as a Deployment instead so it's a persistent controller
# that reschedules itself on its own deschedulingInterval (chart default: 5m).
kind: Deployment

# Pinned explicitly instead of relying on the chart's built-in default policy,
# so a future chart bump can't silently change what gets evicted. This is the
# same balance/deschedule set the chart ships by default (even distribution
# via topology spread + node utilization), with one addition: nodeFit: true,
# so a pod only gets evicted if there's actually another node it could land
# on - on a small cluster like this, evicting into "Pending forever" is worse
# than leaving the imbalance alone.
deschedulerPolicyAPIVersion: "descheduler/v1alpha2"
deschedulerPolicy:
  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            nodeFit: true
            podProtections:
              defaultDisabled:
                - "PodsWithLocalStorage"
              extraEnabled:
                - "PodsWithPVC"
        - name: RemoveDuplicates
        - name: RemovePodsViolatingTopologySpreadConstraint
        - name: LowNodeUtilization
          args:
            thresholds:
              cpu: 20
              memory: 20
              pods: 20
            targetThresholds:
              cpu: 50
              memory: 50
              pods: 50
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint
            - LowNodeUtilization
