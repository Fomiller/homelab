# Chart default is `kind: CronJob`, which spins up a fresh one-shot Job pod
# every tick. Run it as a Deployment instead so it's a persistent controller
# that reschedules itself on its own deschedulingInterval (chart default: 5m).
kind: Deployment

# This is the chart 0.36.0 default policy, copied so DefaultEvictor can take a
# labelSelector. Profiles are a list, so overriding one field means restating
# the whole profile.
deschedulerPolicy:
  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            podProtections:
              defaultDisabled:
              - "PodsWithLocalStorage"
              extraEnabled:
              - "PodsWithPVC"
            # A pod opts out by setting descheduler.fomiller.dev/evict: "false",
            # so homelab never has to know about the app.
            labelSelector:
              matchExpressions:
                - key: descheduler.fomiller.dev/evict
                  operator: NotIn
                  values:
                    - "false"
        - name: RemoveDuplicates
        - name: RemovePodsHavingTooManyRestarts
          args:
            podRestartThreshold: 100
            includingInitContainers: true
        - name: RemovePodsViolatingNodeAffinity
          args:
            nodeAffinityType:
            - requiredDuringSchedulingIgnoredDuringExecution
        - name: RemovePodsViolatingNodeTaints
        - name: RemovePodsViolatingInterPodAntiAffinity
        - name: RemovePodsViolatingTopologySpreadConstraint
        - name: LowNodeUtilization
          args:
            thresholds:
              cpu: 20
              memory: 20
              pods: 20
            targetThresholds:
              cpu: 50
              memory: 50
              pods: 50
      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - RemovePodsViolatingTopologySpreadConstraint
            - LowNodeUtilization
        deschedule:
          enabled:
            - RemovePodsHavingTooManyRestarts
            - RemovePodsViolatingNodeTaints
            - RemovePodsViolatingNodeAffinity
            - RemovePodsViolatingInterPodAntiAffinity
