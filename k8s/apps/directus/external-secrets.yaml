# KEY and SECRET are what Directus signs sessions and encrypts stored
# credentials with — rotating SECRET invalidates every session and breaks
# anything Directus encrypted with the old value. ADMIN_PASSWORD only
# applies on first boot, when Directus bootstraps the admin user.
#
# Terraform-controlled: infra/units/aws/global/secrets/directus.tf.
# Key names match what the chart's deployment reads from
# applicationSecretName (see values.yaml).
#
# Postgres credentials come from CNPG's generated directus-db-cnpg-app
# Secret and S3 access comes from IRSA, so this is the whole secret surface.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: directus-application-secret
  namespace: directus
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: aws-clustersecretstore
    kind: ClusterSecretStore
  target:
    name: directus-application-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev/fomiller/homelab/directus-application-secret
