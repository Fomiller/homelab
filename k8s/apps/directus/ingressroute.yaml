# cms.fomiller.com is already covered by the *.fomiller.com wildcard DNS
# record and the tunnel's wildcard ingress (both in infra/units/cloudflare),
# which forward every subdomain to this Traefik instance. Exposing directus
# is therefore a k8s-only change: Traefik routes to it by Host header here.
#
# This one route covers both the admin app and the content API — Directus
# serves them from the same port.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: directus
  namespace: directus
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`cms.fomiller.com`)
      kind: Rule
      services:
        - name: directus
          port: 80
