apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Micro-services deployed from their own repos
  # Narrower than the homelab project on purpose. These applications point at
  # repos outside this one, so the blast radius of a bad one should not be the
  # whole cluster.
  sourceRepos:
    - https://github.com/Fomiller/*
    - 695434033664.dkr.ecr.us-east-1.amazonaws.com
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    # A service's overlay inflates its Kargo project chart alongside its own,
    # so one Application creates the workload and the pipeline that promotes
    # it. Kargo's Project is cluster-scoped, and the chart creates the project
    # namespace itself so Kargo adopts it.
    - group: kargo.akuity.io
      kind: '*'

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]

  generators:
    # One entry per repo, and the repo answers for itself. The git generator
    # reads argocd.yaml out of each listed repo, so what a service is called,
    # which environment it runs as and which namespace it lands in are the
    # service's own facts. homelab decides only whether to run it at all.
    #
    # golden-argocd generates and manages that file, so it is there before a
    # repo is ever added here.
    - matrix:
        generators:
          - list:
              elements:
                - repoURL: https://github.com/Fomiller/blog.git
                  targetRevision: main
          - git:
              repoURL: '{{ .repoURL }}'
              revision: '{{ .targetRevision }}'
              requeueAfterSeconds: 20
              files:
                - path: argocd.yaml

  template:
    metadata:
      # The service's name, nothing appended. One cluster means one environment
      # per repo, so `blog-prod` only ever said `blog` twice.
      name: '{{ .name }}'
      namespace: argocd
      labels:
        app.kubernetes.io/name: '{{ .name }}'
        flake-hub.fomiller.dev/env: '{{ .env }}'
    spec:
      project: services
      # A single source, unlike before. The overlay is a kustomization that
      # inflates the service chart and its Kargo project chart from ECR, which
      # works because the repo-server has a helm registry credential — see
      # k8s/apps/cluster-resources.
      #
      # Nothing here names a chart version. That lives in the overlay, in the
      # service's repo, where Kargo writes it.
      source:
        repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .targetRevision }}'
        path: 'argocd/overlays/{{ .env }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # The kubelet needs an ECR credential to pull the image, and that
        # Secret is per-namespace. Labelling the namespace is what makes the
        # ClusterExternalSecret write into it, so a new service needs nothing
        # in cluster-resources.
        managedNamespaceMetadata:
          labels:
            fomiller.dev/ecr-pull: "true"
        syncOptions:
          - CreateNamespace=true

  # Deleting an entry should take the workloads with it, not leave them
  # running in the cluster with nothing tracking them.
  syncPolicy:
    preserveResourcesOnDeletion: false
