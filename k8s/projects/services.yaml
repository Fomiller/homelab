apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Micro-services deployed from their own repos
  # Narrower than the homelab project on purpose. These applications point at
  # repos outside this one, so the blast radius of a bad one should not be the
  # whole cluster.
  sourceRepos:
    - https://github.com/Fomiller/*
    # The chart itself comes from ECR, not from the repo. Argo CD checks every
    # source against this list before it tries to pull.
    - 695434033664.dkr.ecr.us-east-1.amazonaws.com
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]

  generators:
    # One file per service per environment under k8s/services/. Adding a
    # service is a new file, not an edit to a list of every service. Same
    # generator the homelab ApplicationSet uses for k8s/apps/**/config.json.
    #
    # Each file supplies service, env, repoURL, targetRevision and namespace.
    # See k8s/services/README.md.
    #
    # Rejected: the scmProvider generator, which would need no registry file at
    # all — point it at the account and filter on pathsExist. Argo CD's GitHub
    # implementation calls Repositories.ListByOrg with no fallback to
    # ListByUser, and Fomiller is a personal account, so the call 404s and the
    # generator finds nothing. Worth revisiting only if the account ever
    # becomes an organisation.
    - git:
        repoURL: https://github.com/Fomiller/homelab.git
        revision: main
        requeueAfterSeconds: 20
        files:
          # YAML, not JSON, because Kargo rewrites these files on every
          # promotion and its yaml-update step emits YAML. A .json file would
          # come back out of a promotion as YAML.
          - path: k8s/services/*/config.yaml

  template:
    metadata:
      name: '{{ .service }}-{{ .env }}'
      namespace: argocd
      labels:
        app.kubernetes.io/name: '{{ .service }}'
        flake-hub.fomiller.dev/env: '{{ .env }}'
    spec:
      project: services
      # Two sources, not a kustomize overlay that inflates the chart itself.
      #
      # Argo CD cannot pull a private OCI chart through kustomize's helmCharts:
      # it hands the kustomize helm invocation a fresh empty HELM_CONFIG_HOME
      # and never writes registry credentials into it, so the pull fails with
      # "basic credential not found" however the repository Secret is declared.
      # A native Helm source with the same credential works, which is this.
      #
      # The values still live in the service's repo. The second source exists
      # only to be referenced as $values — a source carrying `ref` renders
      # nothing itself.
      sources:
        - repoURL: '{{ .registry }}'
          chart: '{{ .service }}-chart'
          targetRevision: '{{ .chartVersion }}'
          helm:
            valueFiles:
              - $values/argocd/overlays/values.app.base.yaml
              - $values/argocd/overlays/{{ .env }}/values.app.yaml
            # A parameter, not a value file, so it wins over the tag the
            # service's own overlay carries. Both versions this Application
            # runs then come from one file that Kargo owns.
            parameters:
              - name: image.tag
                value: '{{ .imageTag }}'
        - repoURL: '{{ .repoURL }}'
          targetRevision: '{{ .targetRevision }}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # CreateNamespace=true alone makes a bare namespace. The label is what
        # the ecr-image-pull ClusterExternalSecret selects on, so without it a
        # new service's pods have no registry credential and sit in
        # ImagePullBackOff.
        managedNamespaceMetadata:
          labels:
            fomiller.dev/ecr-pull: "true"

  # Deleting an entry should take the workloads with it, not leave them
  # running in the cluster with nothing tracking them.
  syncPolicy:
    preserveResourcesOnDeletion: false
